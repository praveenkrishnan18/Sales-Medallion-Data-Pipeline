resources:
  jobs:
    sales_medallion_pipeline:
      name: sales-medallion-pipeline-dab

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "6"
            dependencies:
              - "requests>=2.31.0"

      tasks:
        - task_key: ingest_raw
          notebook_task:
            notebook_path: ../src/01_ingest_raw.py
          environment_key: serverless_env

        - task_key: bronze
          depends_on:
            - task_key: ingest_raw
          notebook_task:
            notebook_path: ../src/02_bronze.py
          environment_key: serverless_env

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/03_silver.py
          environment_key: serverless_env

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/04_gold.py
          environment_key: serverless_env
